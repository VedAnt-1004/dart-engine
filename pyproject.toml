[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dart-engine"
version = "0.1.0"
description = "DART (Dispatch Async Relay & Transport) — a high-throughput, fault-tolerant webhook delivery engine."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "DART Maintainers" }]
dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "httpx>=0.27,<1",
    "redis[hiredis]>=5.0,<6",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fakeredis>=2.21",
    "respx>=0.20",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
dart-api = "dart.cli:run_api"
dart-worker = "dart.worker.runner:main"
dart-scheduler = "dart.worker.scheduler_runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dart = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
